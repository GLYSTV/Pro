name: YERAL-PRO - Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  android:
    name: Crear YERAL-PRO Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK 36
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)"; fi
          echo "Usando sdkmanager en: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow
        run: pip install Pillow

      - name: Instalar dependencias
        run: npm install

      - name: Compilar YERAL-PRO
        run: bash build-yeral.sh

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YERAL-PRO.apk

      - name: Guardar registro de errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: YERAL-PRO-ERRORES
          path: /tmp/gradle1.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Descargar APK YERAL-PRO
        uses: actions/upload-artifact@v4
        with:
          name: YERAL-PRO
          path: YERAL-PRO.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Release YERAL-PRO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yeral-pro-${{ github.run_number }}
          name: YERAL-PRO ${{ github.run_number }}
          files: YERAL-PRO.apk
          make_latest: true


          
