# ───────────────────────────────────────────────────────────────
#  GLYSTV-PRO · despliegue completo con Docker Compose
#
#  1) Añade a tu archivo .env (en esta misma carpeta):
#       POSTGRES_PASSWORD=una-clave-larga-y-segura
#       DOMAIN=tv.tudominio.com        # o deja "localhost" para probar
#  2) docker compose up -d --build
#  3) Abre https://DOMAIN   (Caddy obtiene el certificado HTTPS solo)
# ───────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/app_db
      RECORDINGS_DIR: /app/data/recordings
    volumes:
      - recordings:/app/data/recordings
    # Solo accesible desde la propia máquina; el público entra por Caddy (HTTPS).
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  recordings:
  caddy_data:
  caddy_config:
