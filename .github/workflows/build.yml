name: YERAL-PRO - Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  android:
    name: Crear YERAL-PRO Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK 36
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)"; fi
          echo "Usando sdkmanager en: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow
        run: pip install Pillow

      - name: Instalar dependencias
        run: npm install

      - name: Restaurar firma fija de la APK
        env:
          KS_B64: ${{ secrets.YERAL_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Falta el secreto YERAL_KEYSTORE_B64. Sin él cada APK queda con otra firma y Android no deja actualizar. Crea el secreto y vuelve a ejecutar."
            exit 1
          fi
          # Quita espacios, saltos de línea y restos del prompt de Termux (~ $) por si se pegaron.
          printf '%s' "$KS_B64" | tr -d ' \r\n~$' | base64 -d > "$RUNNER_TEMP/yeral.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/yeral.keystore" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/ks.txt" \
            || { echo "::error::No se pudo leer la clave. El secreto está incompleto o dañado: vuelve a generarlo con base64 -w0."; exit 1; }
          KS_FP=$(grep 'SHA256:' "$RUNNER_TEMP/ks.txt" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Huella SHA-256 de la clave fija: $KS_FP"
          echo "KS_FP=$KS_FP" >> "$GITHUB_ENV"
          echo "YERAL_KEYSTORE=$RUNNER_TEMP/yeral.keystore" >> "$GITHUB_ENV"
          mkdir -p ~/.android && cp "$RUNNER_TEMP/yeral.keystore" ~/.android/debug.keystore

      - name: Compilar YERAL-PRO
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash build-yeral.sh

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YERAL-PRO.apk

      - name: Verificar que la APK lleva la firma fija
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK_FP=$("$APKSIGNER" verify --print-certs YERAL-PRO.apk | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "Huella de la clave fija : $KS_FP"
          echo "Huella firmada en la APK: $APK_FP"
          if [ "$APK_FP" != "$KS_FP" ]; then
            echo "::error::La APK NO está firmada con la clave fija. No se publica."
            exit 1
          fi
          echo "OK: la APK usa la firma fija."

      - name: Guardar registro de errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: YERAL-PRO-ERRORES
          path: /tmp/gradle1.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Descargar APK YERAL-PRO
        uses: actions/upload-artifact@v4
        with:
          name: YERAL-PRO
          path: YERAL-PRO.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Release YERAL-PRO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yeral-pro-${{ github.run_number }}
          name: YERAL-PRO ${{ github.run_number }}
          files: YERAL-PRO.apk
          make_latest: true
          
