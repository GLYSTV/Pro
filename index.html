<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLYSTV PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<style>
:root{--s:#0b0d14;--s2:#11141f;--s3:#181c2b;--s4:#20253a;--b:#8b5cf6;--b2:#d946ef;--t:#eef0f8;--m:#8f95b2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--t);background:radial-gradient(900px 500px at 80% -10%,rgba(139,92,246,.18),transparent 60%),radial-gradient(700px 400px at -10% 20%,rgba(217,70,239,.1),transparent 60%),var(--s)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.logo{font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--b),var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent}
#app{display:flex;flex-direction:column;height:100%;max-width:980px;margin:auto}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.top .logo{font-size:20px;flex:1}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--s3);border:2px solid var(--b)}
main{flex:1;overflow:auto;padding:0 16px 16px}
h2{font-size:18px;margin:6px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--s3);color:var(--m);font-size:14px;border:1px solid transparent}
.chip.on{background:linear-gradient(90deg,var(--b),var(--b2));color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--s2);border:1px solid var(--s4);border-radius:14px;padding:12px;text-align:left;position:relative}
.card:active{border-color:var(--b)}
.lg{height:64px;border-radius:10px;display:grid;place-items:center;font-size:28px;margin-bottom:10px}
.nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--m);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;background:#ef4444;border-radius:6px;padding:2px 6px}
.fav{position:absolute;bottom:8px;right:10px;font-size:18px;color:var(--m)}
.fav.on{color:var(--b2)}
nav{display:flex;background:var(--s2);border-top:1px solid var(--s4)}
nav button{flex:1;padding:10px 4px;font-size:11px;color:var(--m);display:flex;flex-direction:column;gap:3px;align-items:center}
nav button b{font-size:19px;font-weight:400}
nav button.on{color:#fff}
nav button.on b{color:var(--b2)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--s3)}
.row .lg{width:44px;height:44px;margin:0;font-size:20px;flex:none}
.tl{flex:1;min-width:0}
.bar{height:6px;border-radius:9px;background:var(--s4);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--b2))}
.pf{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.pf button{background:var(--s2);border:1px solid var(--s4);border-radius:16px;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.pf .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px}
#pick{position:fixed;inset:0;z-index:5;background:var(--s);padding:60px 20px;text-align:center;overflow:auto}
#pick .logo{font-size:30px}
#pick p{color:var(--m);margin-top:6px}
.form{display:grid;gap:10px;margin-top:8px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--s4);background:var(--s2);color:var(--t);font:inherit}
.btn{padding:12px;border-radius:12px;background:linear-gradient(90deg,var(--b),var(--b2));font-weight:700;color:#fff;text-align:center}
.note{background:var(--s2);border:1px dashed var(--s4);border-radius:12px;padding:12px;color:var(--m);font-size:13px;margin-top:14px;line-height:1.45}
#pl{position:fixed;inset:0;z-index:9;background:#000;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#pl.on{display:flex}
.scr{flex:1;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#241a45,#000 70%)}
.scr big{font-size:64px;display:block}
.ctl{display:flex;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000a);flex-wrap:wrap}
.ctl button{padding:9px 13px;border-radius:10px;background:#ffffff1c;font-size:13px}
.ctl .sp{flex:1}
#login{position:fixed;inset:0;z-index:8;overflow:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(11,13,20,.7),var(--s)),radial-gradient(800px 500px at 50% 0,rgba(139,92,246,.35),transparent 70%),var(--s)}
.lw{max-width:420px;margin:auto;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:12px;justify-content:center}
.bi{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--b),var(--b2));box-shadow:0 8px 24px rgba(139,92,246,.35)}
.bt{font-size:24px;font-weight:800}
.bt em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:1px;margin-left:6px;padding:2px 6px;border-radius:6px;background:linear-gradient(90deg,var(--b),var(--b2));vertical-align:middle}
.bs{font-size:11px;letter-spacing:2px;color:var(--m);text-transform:uppercase}
.lc{background:#11141fcc;border:1px solid #ffffff1a;border-radius:20px;padding:20px;backdrop-filter:blur(8px)}
.lc h1{font-size:22px}
.lc h3{font-size:16px}
.lc p{color:var(--m);font-size:13px;margin-top:4px;line-height:1.45}
.lc label{display:block;font-size:12px;color:var(--m);margin:12px 0 6px}
.lc .btn{margin-top:16px;border:0;width:100%}
.lc .alt{display:block;width:100%;text-align:center;margin-top:12px;color:var(--b2);font-size:13px}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:150px;height:150px;margin:14px auto 10px;background:#fff;padding:8px;border-radius:12px;gap:0}
.qr i{background:#fff}.qr i.k{background:#000}
.cd{text-align:center;font-size:30px;font-weight:800;letter-spacing:.3em}
.cs{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--m);text-transform:uppercase}
.lg img{max-width:100%;max-height:100%;object-fit:contain}
.lg{background:var(--s3);overflow:hidden}
.se{margin-bottom:10px}
.hide{display:none}
#vid{width:100%;flex:1;background:#000;min-height:0}
#pick,#app{display:none}
#qrbox{display:none;text-align:center}
#qrc{width:170px;height:170px;border-radius:12px;margin:12px auto 6px;display:block}
#lerr{display:none;margin-top:12px;font-size:13px;border:1px solid #ffffff22;border-radius:10px;padding:8px 10px}
</style>
</head>
<body>
<div id="login"><div class="lw">
  <div class="brand"><div class="bi">📡</div><div><div class="bt">GLYS<span class="logo">TV</span><em>PRO</em></div><div class="bs">IPTV Player</div></div></div>
  <div class="lc">
    <h1>Iniciar sesión</h1><p>Entra con los datos de tu proveedor IPTV.</p>
    <label>URL del servidor</label><input id="srv" placeholder="http://servidor.com:8080" autocapitalize="off" autocomplete="off">
    <label>Usuario</label><input id="usr" placeholder="usuario" autocapitalize="off" autocomplete="off">
    <label>Contraseña</label><input id="pwd" type="password" placeholder="••••••••" autocomplete="off">
    <button class="btn" id="lgIn">Entrar</button>
    <button class="alt" id="lgM3">Usar una lista M3U</button>
    <div id="lerr"></div>
  </div>
  <div class="lc" id="qrbox">
    <h3>📱 Entrar desde el móvil</h3>
    <p>Escanea este código con tu teléfono y escribe ahí el servidor, usuario y contraseña.</p>
    <canvas id="qrc"></canvas><p id="qrtxt"></p>
  </div>
</div></div>
<div id="pick"><div class="logo" style="font-size:30px;font-weight:800">GLYSTV PRO</div><p style="color:var(--m);margin-top:6px">¿Quién está viendo?</p><div class="pf" id="pfs"></div></div>
<div id="app">
  <div class="top"><span class="logo">GLYSTV PRO</span><button class="av" id="me">😎</button></div>
  <main id="v"></main>
  <nav id="nv"></nav>
</div>
<div id="pl">
  <video id="vid" playsinline controls></video>
  <div class="ctl"><button id="plB">‹ Volver</button><span id="plN" style="align-self:center;font-weight:700"></span><span class="sp"></span><button id="plF">♡ Favorito</button></div>
</div>
<script>
var NP=null;try{var C=window.Capacitor;if(C&&((C.isNativePlatform&&C.isNativePlatform())||(C.Plugins&&C.Plugins.NativePlayer)))NP=C.registerPlugin?C.registerPlugin('NativePlayer'):C.Plugins.NativePlayer}catch(e){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var AV=["😀","😎","🧑‍🚀","🦊","🐼","🦄","🐯","🤖"],CO=["#8b5cf6","#d946ef","#0ea5e9","#10b981","#f59e0b","#ef4444"];
var SP=/evento|event|deport|sport|⚽|⚾|🏀|🏈|🥊|🏎|ppv|ufc|nba|mlb|nfl|f[uú]tbol|liga|espn/i;
var S={tab:'home',cat:'Todos',q:'',lim:90,chs:[],pf:ld('pro_pf',[{n:'Principal',a:'😎',c:CO[0]}]),pi:0,fav:[],sess:ld('pro_sess',null),cur:null};
function norm(u){u=(u||'').trim().replace(/\/+$/,'');return /^https?:\/\//i.test(u)?u:'http://'+u}
function msg(t,bad){var e=$('lerr');e.textContent=t||'';e.style.display=t?'block':'none';e.style.color=bad?'#fca5a5':'#a7f3d0'}
function show(id,on){$(id).style.display=on?(id=='app'?'flex':'block'):'none'}
/* ---------- Carga de canales ---------- */
async function loadXtream(ss){
  var q='?username='+encodeURIComponent(ss.u)+'&password='+encodeURIComponent(ss.p);
  var r=await fetch(ss.s+'/player_api.php'+q);var d=await r.json();
  if(!d.user_info||d.user_info.auth==0)throw new Error('Usuario o contraseña incorrectos.');
  var cats={};try{(await (await fetch(ss.s+'/player_api.php'+q+'&action=get_live_categories')).json()).forEach(function(c){cats[c.category_id]=c.category_name})}catch(e){}
  var ls=await (await fetch(ss.s+'/player_api.php'+q+'&action=get_live_streams')).json();
  if(!Array.isArray(ls))ls=[];
  return ls.map(function(c){var b=ss.s+'/live/'+encodeURIComponent(ss.u)+'/'+encodeURIComponent(ss.p)+'/'+c.stream_id;
    return{name:c.name,group:cats[c.category_id]||'Sin categoría',logo:c.stream_icon||'',url:b+'.m3u8',sid:c.stream_id}})
}
function parseM3U(t){var out=[],m=null;t.split(/\r?\n/).forEach(function(l){l=l.trim();if(l.indexOf('#EXTINF')==0){m={name:(l.split(',').pop()||'Canal').trim(),group:(/group-title="([^"]*)"/.exec(l)||[])[1]||'Sin categoría',logo:(/tvg-logo="([^"]*)"/.exec(l)||[])[1]||''}}else if(m&&l&&l[0]!='#'){m.url=l;out.push(m);m=null}});return out}
function prep(l){l.sort(function(a,b){return (SP.test(a.group)?0:1)-(SP.test(b.group)?0:1)});return l}
async function enter(ss){
  msg('Cargando canales…');
  try{
    var l=ss.m3u?parseM3U(await (await fetch(ss.m3u)).text()):await loadXtream(ss);
    if(!l.length)throw new Error('La lista no tiene canales.');
    S.chs=prep(l);S.sess=ss;sv('pro_sess',ss);msg('');show('login',0);openProfiles()
  }catch(e){msg(e.message&&e.message.length<90?e.message:'No se pudo conectar. Revisa los datos y la conexión.',1)}
}
/* ---------- Perfiles ---------- */
function openProfiles(){
  $('pfs').innerHTML=S.pf.map(function(p,i){return '<button data-p="'+i+'"><div class="big" style="background:'+p.c+'33;border:2px solid '+p.c+'">'+p.a+'</div><b>'+esc(p.n)+'</b>'+(p.k?'<span class="sub">Modo niños</span>':'')+'</button>'}).join('')+(S.pf.length<6?'<button data-p="new"><div class="big" style="background:#ffffff14">+</div><b>Añadir</b></button>':'');
  show('pick',1);show('app',0)
}
function pickProfile(i){
  if(i=='new'){var n=prompt('Nombre del perfil');if(!n)return;var k=confirm('¿Es un perfil para niños? (oculta Fuentes)');
    S.pf.push({n:n.slice(0,16),a:AV[S.pf.length%AV.length],c:CO[S.pf.length%CO.length],k:k});sv('pro_pf',S.pf);openProfiles();return}
  S.pi=+i;S.fav=ld('pro_fav_'+S.pi,[]);var p=S.pf[S.pi];$('me').textContent=p.a;S.tab='home';S.cat='Todos';S.q='';S.lim=90;show('pick',0);show('app',1);draw()
}
/* ---------- Vistas ---------- */
function kid(){return S.pf[S.pi]&&S.pf[S.pi].k}
function isFav(c){return S.fav.some(function(f){return f.url==c.url})}
function togFav(c){var i=-1;S.fav.forEach(function(f,j){if(f.url==c.url)i=j});if(i>=0)S.fav.splice(i,1);else S.fav.unshift({name:c.name,group:c.group,logo:c.logo,url:c.url,sid:c.sid});sv('pro_fav_'+S.pi,S.fav)}
var VL=[];
function card(c,i){var lg=c.logo?'<img src="'+esc(c.logo)+'" alt="" loading="lazy" onerror="this.remove()">':'📺';
  return '<button class="card" data-i="'+i+'"><div class="lg">'+lg+'</div><div class="nm">'+esc(c.name)+'</div><div class="sub">'+esc(c.group)+'</div><span class="fav'+(isFav(c)?' on':'')+'" data-f="'+i+'">'+(isFav(c)?'♥':'♡')+'</span></button>'}
function cats(){var g=['Todos'];S.chs.forEach(function(c){if(g.indexOf(c.group)<0)g.push(c.group)});return g}
function home(){
  var q=S.q.toLowerCase();VL=S.chs.filter(function(c){return(S.cat=='Todos'||c.group==S.cat)&&(!q||c.name.toLowerCase().indexOf(q)>=0)});
  var more=VL.length>S.lim;
  return '<input class="se" id="se" placeholder="Buscar canal…" value="'+esc(S.q)+'"><div class="chips">'+cats().map(function(g){return '<button class="chip'+(g==S.cat?' on':'')+'" data-c="'+esc(g)+'">'+esc(g)+'</button>'}).join('')+'</div><div class="grid">'+VL.slice(0,S.lim).map(card).join('')+'</div>'+(more?'<button class="btn" id="more" style="margin:16px 0;width:100%">Ver más ('+(VL.length-S.lim)+')</button>':'')
}
function fav(){VL=S.fav;return '<h2>Favoritos</h2>'+(VL.length?'<div class="grid">'+VL.map(card).join('')+'</div>':'<div class="note">Aún no tienes favoritos. Toca el corazón en un canal.</div>')}
function guide(){
  VL=S.chs.filter(function(c){return(S.cat=='Todos'||c.group==S.cat)}).slice(0,30);
  setTimeout(epg,50);
  return '<h2>Guía TV</h2><div class="chips">'+cats().slice(0,25).map(function(g){return '<button class="chip'+(g==S.cat?' on':'')+'" data-c="'+esc(g)+'">'+esc(g)+'</button>'}).join('')+'</div>'+VL.map(function(c,i){return '<button class="row" style="width:100%;text-align:left" data-i="'+i+'"><div class="lg">'+(c.logo?'<img src="'+esc(c.logo)+'" alt="" onerror="this.remove()">':'📺')+'</div><div class="tl"><div class="nm">'+esc(c.name)+'</div><div class="sub" id="ep'+i+'">'+(c.sid?'Cargando…':'Sin guía en listas M3U')+'</div><div class="bar"><i id="eb'+i+'" style="width:0"></i></div></div></button>'}).join('')
}
function b64(s){try{return decodeURIComponent(escape(atob(s)))}catch(e){return s}}
async function epg(){
  var ss=S.sess;if(!ss||ss.m3u||S.tab!='guide')return;var now=Date.now()/1000;
  for(var i=0;i<VL.length&&S.tab=='guide';i+=4){
    await Promise.all(VL.slice(i,i+4).map(async function(c,k){var j=i+k,e=$('ep'+j);if(!e||!c.sid)return;
      try{var r=await (await fetch(ss.s+'/player_api.php?username='+encodeURIComponent(ss.u)+'&password='+encodeURIComponent(ss.p)+'&action=get_short_epg&stream_id='+c.sid+'&limit=2')).json();
        var l=(r.epg_listings||[])[0];if(!l){e.textContent='Sin información';return}
        e.textContent='Ahora: '+b64(l.title);var s=+l.start_timestamp,f=+l.stop_timestamp;if(f>s)$('eb'+j).style.width=Math.max(2,Math.min(100,(now-s)*100/(f-s)))+'%'}catch(x){e.textContent='Sin información'}}))
  }
}
function src(){var s=S.sess||{};return '<h2>Fuentes</h2><div class="note" style="margin:0 0 14px">Fuente actual: <b style="color:#fff">'+esc(s.m3u?'Lista M3U':s.s||'—')+'</b> · '+S.chs.length+' canales</div><div class="form"><button class="btn" id="reload">Recargar canales</button><button class="btn" id="chPf" style="background:var(--s3)">Cambiar de perfil</button><button class="btn" id="out" style="background:var(--s3)">Cerrar sesión</button></div>'}
function draw(){
  var T=[['home','⌂','Inicio'],['fav','♥','Favoritos'],['guide','▤','Guía TV'],['src','☰','Fuentes']].filter(function(t){return !(kid()&&t[0]=='src')});
  $('v').innerHTML={home:home,fav:fav,guide:guide,src:src}[S.tab]();
  $('nv').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab==t[0]?'on':'')+'"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('')
}
/* ---------- Reproducción ---------- */
var hls=null;
function play(c){
  S.cur=c;
  if(NP){NP.play({url:c.url,title:c.name}).catch(function(){});return}
  $('plN').textContent=c.name;$('plF').textContent=isFav(c)?'♥ Favorito':'♡ Favorito';$('pl').className='on';
  var v=$('vid');if(hls){hls.destroy();hls=null}
  if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})})}
  else{v.src=c.url;v.play().catch(function(){})}
}
function closePl(){$('pl').className='';var v=$('vid');v.pause();v.removeAttribute('src');if(hls){hls.destroy();hls=null}}
/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-f],[data-c],[data-t],[data-i],[data-p],#more,#reload,#chPf,#out');if(!t)return;
  if(t.dataset.f!=null){togFav(VL[+t.dataset.f]);draw();return}
  if(t.dataset.c!=null){S.cat=t.dataset.c;S.lim=90;draw();return}
  if(t.dataset.t){S.tab=t.dataset.t;draw();return}
  if(t.dataset.i!=null){play(VL[+t.dataset.i]);return}
  if(t.dataset.p!=null){pickProfile(t.dataset.p);return}
  if(t.id=='more'){S.lim+=120;draw();return}
  if(t.id=='reload'){enter(S.sess);return}
  if(t.id=='chPf'){openProfiles();return}
  if(t.id=='out'){try{localStorage.removeItem('pro_sess')}catch(x){}S.sess=null;S.chs=[];show('app',0);show('pick',0);show('login',1);return}
});
document.addEventListener('input',function(e){if(e.target.id=='se'){S.q=e.target.value;S.lim=90;var p=e.target.selectionStart;draw();var n=$('se');n.focus();try{n.setSelectionRange(p,p)}catch(x){}}});
$('plB').onclick=closePl;
$('plF').onclick=function(){togFav(S.cur);$('plF').textContent=isFav(S.cur)?'♥ Favorito':'♡ Favorito';draw()};
$('me').onclick=openProfiles;
$('lgIn').onclick=function(){var s=$('srv').value.trim(),u=$('usr').value.trim(),p=$('pwd').value;if(!s||!u||!p){msg('Completa servidor, usuario y contraseña.',1);return}enter({s:norm(s),u:u,p:p})};
$('lgM3').onclick=function(){var u=prompt('Pega la URL de tu lista M3U');if(u&&/^https?:\/\//i.test(u.trim()))enter({m3u:u.trim()})};
/* ---------- QR para entrar desde el móvil (igual que GLYSTV) ---------- */
(function(){
  var BASE='https://alfades987-commits.github.io/Milenio8k/',peer=null;
  function ld2(u,t,cb){if(t()){cb(1);return}var s=document.createElement('script');s.src=u;s.onload=function(){cb(t())};s.onerror=function(){cb(0)};document.head.appendChild(s)}
  function txt(t){$('qrtxt').textContent=t}
  function draw2(text){var cv=$('qrc'),q=qrcode(0,'M');q.addData(text);q.make();var n=q.getModuleCount(),pad=4,px=6,sz=(n+pad*2)*px;cv.width=cv.height=sz;var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sz,sz);g.fillStyle='#000';for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))g.fillRect((c+pad)*px,(r+pad)*px,px,px)}
  if(!(NP||window.innerWidth>=900))return;
  $('qrbox').style.display='block';txt('Preparando código QR…');
  ld2('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js',function(){return typeof window.qrcode=='function'},function(a){
    ld2('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',function(){return !!(window.Peer||(window.peerjs&&window.peerjs.Peer))},function(b){
      if(!a||!b){txt('No se pudo cargar el QR. Usa el formulario.');return}
      var P=window.Peer||window.peerjs.Peer,id='glystv-'+Math.random().toString(36).slice(2,12).toUpperCase();
      peer=new P(id);peer.on('open',function(pid){draw2(BASE+'?pair='+encodeURIComponent(pid));txt('Escanea el código QR con tu teléfono')});
      peer.on('connection',function(cn){cn.on('data',function(d){try{if(typeof d=='string')d=JSON.parse(d);if(!d||!d.s||!d.u||!d.p)return;$('srv').value=d.s;$('usr').value=d.u;$('pwd').value=d.p;try{cn.send({t:'ack'})}catch(x){}txt('Datos recibidos. Iniciando sesión…');$('lgIn').click()}catch(x){}})});
      peer.on('error',function(){txt('Sin conexión con el servicio del QR.')})
    })})
})();
