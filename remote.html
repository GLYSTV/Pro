<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLYSTV</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(160deg,#0a1260,#2a0e5a);font-family:system-ui,sans-serif;color:#fff;padding:16px}
form{width:100%;max-width:420px;background:#0f1014;border:1px solid #343238;border-radius:18px;padding:26px 22px}
h1{margin:0 0 4px;text-align:center;font-size:28px}
h1 b{color:#e6bd58}
p{margin:0 0 18px;text-align:center;color:#bbb;font-size:15px}
input[type=text],input[type=url],input[type=password]{
width:100%;height:52px;margin-bottom:14px;border:1px solid #34343b;border-radius:10px;
padding:0 14px;font-size:17px;color:#fff;background:#090a0d}
label{display:block;margin:0 0 16px;font-size:15px;color:#ddd}
button{width:100%;height:52px;border:0;border-radius:10px;
background:linear-gradient(110deg,#c9000b,#f01824);color:#fff;font-size:17px;font-weight:700}
button:disabled{opacity:.6}
#m{margin-top:14px;text-align:center;font-size:15px;min-height:20px}
#net{font-size:12px;color:#8ab;margin-top:10px;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="off">
<h1>GLYS<b>TV</b></h1>
<p>Escribe tus datos y se enviarán a la TV</p>
<input name="s" type="url" placeholder="URL del servidor (http://...)" value="%%S%%"
autocapitalize="off" autocorrect="off" required>
<input name="u" type="text" placeholder="Usuario"
autocapitalize="off" autocorrect="off" required>
<input name="p" id="p" type="password" placeholder="Contraseña"
autocapitalize="off" required>
<label><input type="checkbox" id="sh"> Mostrar contraseña</label>
<button id="b">ENVIAR A LA TV</button>
<div id="m"></div>
<div id="net">🔒 Conexión local. Asegúrate de estar en tu red Wi-Fi doméstica.</div>
</form>
<script>
(function(){
  var f=document.getElementById('f');
  var m=document.getElementById('m');
  var b=document.getElementById('b');
  var sh=document.getElementById('sh');
  var p=document.getElementById('p');

  sh.onchange=function(){
    p.type=this.checked?'text':'password';
  };

  function formToBody(form){
    var fd=new FormData(form);
    var out=[];
    fd.forEach(function(v,k){
      out.push(encodeURIComponent(k)+'='+encodeURIComponent(v));
    });
    return out.join('&');
  }

  f.onsubmit=function(e){
    e.preventDefault();
    b.disabled=true;
    m.textContent='Enviando…';
    m.style.color='#fff';

    fetch('send'+location.search,{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:formToBody(f)
    })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      m.textContent='✔ Enviado. Mira la TV.';
      m.style.color='#6fe08a';
    })
    .catch(function(err){
      m.textContent='No se pudo enviar. Escanea el QR otra vez.';
      m.style.color='#ff8a8a';
      b.disabled=false;
    });
  };
})();
</script>
</body>
</html>
