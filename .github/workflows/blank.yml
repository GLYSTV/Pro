name: Descomprimir proyecto
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limpiar y extraer
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name glystv.zip -exec rm -rf {} +
          unzip -o glystv.zip
          rm -f glystv.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Proyecto GLYSTV PRO limpio"
          git push
